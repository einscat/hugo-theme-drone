{{ define "main" }}
<div class="home-page relative w-full h-screen overflow-hidden bg-bg">
  <div class="home-stage absolute left-1/2 top-1/2 z-10 w-0 h-0">

    {{ partial "cards/hi.html" . }}
    {{ partial "cards/clock.html" . }}
    {{ partial "cards/moments.html" . }}
    {{ partial "cards/nav.html" . }}
    {{ partial "cards/calendar.html" . }}

  </div>

  {{ if .Site.Params.icp }}
  <div class="home-icp absolute bottom-4 w-full text-center z-20 pointer-events-none">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="pointer-events-auto text-xs font-sans text-secondary/60 hover:text-brand transition-colors no-underline">
      {{ .Site.Params.icp }}
    </a>
  </div>
  {{ end }}
</div>
{{ end }}
